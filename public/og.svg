<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Driftline. Catch the drift before the detour.</title>
  <desc id="desc">An editorial graphic for the Driftline agent intent instrument.</desc>
  <rect width="1200" height="630" fill="#f2f0e9"/>
  <path d="M48 98H1152M48 557H1152" stroke="#242b27" stroke-width="2"/>
  <circle cx="69" cy="55" r="23" fill="none" stroke="#242b27" stroke-width="2"/>
  <path d="M54 66h10L76 42h10M76 42l-5-6M76 42l-5 8" fill="none" stroke="#d65338" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="105" y="67" fill="#242b27" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="32" font-weight="800" letter-spacing="-2">driftline<tspan fill="#d65338">.</tspan></text>
  <text x="1139" y="61" text-anchor="end" fill="#69746a" font-family="Menlo, monospace" font-size="13" letter-spacing="1">AGENT INTENT INSTRUMENT  /  NO. 01</text>
  <text x="55" y="192" fill="#d65338" font-family="Menlo, monospace" font-size="14" letter-spacing="2">REAL-TIME COURSE CORRECTION</text>
  <text x="46" y="318" fill="#242b27" font-family="Iowan Old Style, Georgia, serif" font-size="103" letter-spacing="-5">Catch the drift</text>
  <text x="46" y="423" fill="#d65338" font-family="Iowan Old Style, Georgia, serif" font-size="103" font-style="italic" letter-spacing="-5">before the detour.</text>
  <text x="54" y="501" fill="#5c655d" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="23">A live signal for the moment before an agent commits.</text>
  <text x="55" y="600" fill="#242b27" font-family="Menlo, monospace" font-size="13" letter-spacing="1">ONE GOAL</text>
  <circle cx="202" cy="596" r="3" fill="#d65338"/>
  <text x="226" y="600" fill="#242b27" font-family="Menlo, monospace" font-size="13" letter-spacing="1">CONTINUOUS SIGNAL</text>
  <circle cx="462" cy="596" r="3" fill="#d65338"/>
  <text x="486" y="600" fill="#242b27" font-family="Menlo, monospace" font-size="13" letter-spacing="1">A CONCRETE PIVOT</text>
